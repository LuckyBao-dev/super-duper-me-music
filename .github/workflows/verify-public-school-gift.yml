name: Verify public school gift HTTPS and audio
on:
  push:
    paths:
      - '.github/workflows/verify-public-school-gift.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1-5'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check recipient HTTPS, redirect, page, external scripts and full MP3 files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, re, ssl, urllib.request
          from urllib.parse import urljoin, urlparse
          start = "https://luckybao-dev.github.io/super-duper-me-music/schools.html"
          ctx = ssl.create_default_context()
          def fetch(url, limit=15000000):
              req = urllib.request.Request(url, headers={"User-Agent": "LittleMelodiesSchoolGiftHealthCheck/1.0"})
              with urllib.request.urlopen(req, timeout=30, context=ctx) as response:
                  final = response.geturl()
                  assert urlparse(final).scheme == "https", f"Non-HTTPS redirect: {final}"
                  data = response.read(limit + 1)
                  assert len(data) <= limit, f"Unexpectedly large response: {final}"
                  assert response.status == 200, f"HTTP {response.status}: {final}"
                  print("OK HTTPS", url, "=>", final, len(data), "bytes")
                  return final, data
          final, page = fetch(start, 2000000)
          assert b"Super Duper Me" in page or b"Super-Duper-Me" in page, "Expected school gift content missing"
          text = page.decode("utf-8")
          for url in re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)', text, flags=re.I):
              fetch(urljoin(final, url), 3000000)
          expected = {
              "Super-Duper-Me.mp3": (4388588, "29cc67bc6f2075b9ee8328060881ab7cb853e0d6257cf77aedec5b9abb41a50c"),
              "Shake-Your-Shoes.mp3": (3658220, "c680c9a6a1ca991e69d559d1dc11f5cb4f4bad11793c271e890fbc827bc45137"),
              "Friends-Make-the-World-Shine.mp3": (4579820, "ded3a46a6063e0bc68e039876f125720e94b29886c8affbcdf8d155979b0d3b2"),
          }
          for name, (size, sha) in expected.items():
              matches = re.findall(r'["\\\']([^"\\\']*' + re.escape(name) + r')["\\\']', text)
              assert matches, f"MP3 path not referenced in school page: {name}"
              url = urljoin(final, "audio/" + name)
              _, data = fetch(url)
              assert len(data) == size, f"Wrong MP3 length: {name}"
              assert hashlib.sha256(data).hexdigest() == sha, f"Wrong MP3 SHA256: {name}"
              print("VERIFIED FULL AUDIO", name)
          assert "JSZip" in text and "generateAsync" in text, "Expected ZIP generation code missing"
          print("PASS: recipient HTTPS, page, external scripts, full MP3 SHA256, ZIP construction code present")
          PY
