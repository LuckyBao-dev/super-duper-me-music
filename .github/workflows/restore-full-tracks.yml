name: Restore full-length school songs
on:
  push:
    paths:
      - '.audio-parts/**'
      - '.github/workflows/restore-full-tracks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble and validate full-length MP3s
        shell: bash
        run: |
          set -euo pipefail
          test -d .audio-parts
          for song in Super-Duper-Me Shake-Your-Shoes Friends-Make-the-World-Shine; do
            test -f ".audio-parts/${song}.000.b64"
            cat ".audio-parts/${song}."*.b64 | base64 --decode > "audio/${song}.mp3"
            test "$(wc -c < "audio/${song}.mp3")" -gt 3000000
            ffprobe -v error -show_entries format=duration -of csv=p=0 "audio/${song}.mp3" | awk '{if ($1 < 120) exit 1}'
          done
          printf '%s\n' \
            "ded3a46a6063e0bc68e039876f125720e94b29886c8affbcdf8d155979b0d3b2  audio/Friends-Make-the-World-Shine.mp3" \
            "c680c9a6a1ca991e69d559d1dc11f5cb4f4bad11793c271e890fbc827bc45137  audio/Shake-Your-Shoes.mp3" \
            "29cc67bc6f2075b9ee8328060881ab7cb853e0d6257cf77aedec5b9abb41a50c  audio/Super-Duper-Me.mp3" | sha256sum -c -
      - name: Commit verified replacements
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audio-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace 30-second previews with verified full-length school MP3s"
          git push
