name: Check and enable GitHub Pages HTTPS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-enable-pages-https.yml'
permissions:
  contents: read
  pages: write
jobs:
  pages-https:
    runs-on: ubuntu-latest
    steps:
      - name: Read certificate status and enable HTTPS when approved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, ssl, socket
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          domain='littlemelodies.ca'
          for host in (domain,'www.'+domain):
            try:
              ips=sorted({x[4][0] for x in socket.getaddrinfo(host,443,proto=socket.IPPROTO_TCP)})
              print('DNS',host,', '.join(ips),flush=True)
            except Exception as e:
              print('DNS not ready for',host,type(e).__name__,str(e),flush=True)
          api='https://api.github.com/repos/'+repo+'/pages'
          def call(method, data=None):
            headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}
            if data is not None: headers['Content-Type']='application/json'
            req=urllib.request.Request(api,data=json.dumps(data).encode() if data is not None else None,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                return r.status, r.read().decode()
            except urllib.error.HTTPError as e:
              return e.code,e.read().decode()
          status,raw=call('GET')
          print('GitHub Pages status code:',status,flush=True)
          if status!=200:
            print(raw[:1200],flush=True); raise SystemExit(0)
          p=json.loads(raw)
          cert=p.get('https_certificate') or {}
          print('Pages settings:',json.dumps({
            'cname':p.get('cname'),'html_url':p.get('html_url'),'status':p.get('status'),
            'https_enforced':p.get('https_enforced'),'certificate':cert,
            'protected_domain_state':p.get('protected_domain_state')
          }),flush=True)
          if p.get('cname')!=domain:
            print('HOLD: Custom domain is not registered in Pages settings. No HTTPS change attempted.',flush=True)
            raise SystemExit(0)
          if p.get('https_enforced'):
            print('SUCCESS: HTTPS already enforced.',flush=True)
            raise SystemExit(0)
          if cert.get('state')!='approved':
            print('PENDING: Certificate not approved yet. GitHub must issue it first.',flush=True)
            raise SystemExit(0)
          s,raw=call('PUT',{'https_enforced':True})
          print('HTTPS setting update HTTP status:',s,flush=True)
          if s!=204:
            print('Update not applied. GitHub response:',raw[:1800],flush=True)
            raise SystemExit(0)
          s2,raw2=call('GET')
          if s2==200 and json.loads(raw2).get('https_enforced'):
            print('SUCCESS: GitHub Pages HTTPS enforcement enabled and confirmed.',flush=True)
          else:
            print('Update accepted, but enforcement not yet confirmed. Recheck settings.',flush=True)
          PY
